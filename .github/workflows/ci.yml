name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Branch protection refers to the job names `server` and `client`.
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # The default is inside node_modules, which `npm ci` deletes after the cache is restored.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/package.json
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci

      # No secrets or .env: vitest.config.js sets dummy values, and Gemini, YouTube and Auth0 are mocked.
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: client/package.json
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          # Placeholders: the build only inlines these, nothing is called.
          VITE_AUTH0_DOMAIN: example.auth0.test
          VITE_AUTH0_CLIENT_ID: ci-placeholder-client-id
          VITE_AUTH0_AUDIENCE: https://api.test
          VITE_API_BASE_URL: /api
